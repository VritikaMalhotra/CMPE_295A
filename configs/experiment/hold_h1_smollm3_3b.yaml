# @package _global_
# Confirmatory (docs/preregistration_osf.md). Do not submit before the registration is filed (§9).
# Stage C1: H1 damage cells for smollm3-3b: Q4_0-pure, Q4_K_M, IQ4_XS on the BFCL holdout, CUDA.
# Pairs with hold_ref_smollm3_3b by (task, seed). 4,500 specs.
experiment:
  name: hold_h1_smollm3_3b
  model: smollm3-3b
  benchmark: bfcl_multi_turn_base
  task_ids_file: results/m3/holdout_tasks_bfcl.json   # registered holdout, SHA-256 checked
  n_tasks: 100
  thinking: false
  max_steps_per_turn: 20
  baselines:
    - {variant: q4_0, backend: cuda}
    - {variant: q4_0, backend: cuda, decoding: {temperature: 0.0, top_k: 1}, seeds: [0]}   # greedy pass
    - {variant: q4_k_m, backend: cuda}
    - {variant: q4_k_m, backend: cuda, decoding: {temperature: 0.0, top_k: 1}, seeds: [0]}   # greedy pass
    - {variant: iq4_xs, backend: cuda}
    - {variant: iq4_xs, backend: cuda, decoding: {temperature: 0.0, top_k: 1}, seeds: [0]}   # greedy pass
  baseline_seeds: [5, 6, 7, 8]
  repairs: []
  repair_seeds: [5]
  decoding: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, n_predict: 4096, cache_prompt: false}
  server: {ctx: 40960}
  extra_benchmarks:
    - {name: bfcl_multi_turn_miss_func}
    - {name: bfcl_multi_turn_miss_param}
slurm:
  time: "1-00:00:00"
  max_requeue: 3
models:
  smollm3-3b:
    hf_repo: HuggingFaceTB/SmolLM3-3B
    files: {q4_0: SmolLM3-3B-Q4_0-pure.gguf, q4_k_m: SmolLM3-3B-Q4_K_M.gguf, iq4_xs: SmolLM3-3B-IQ4_XS.gguf}
