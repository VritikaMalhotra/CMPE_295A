# @package _global_
# M2 Stage 1: BF16 reference for LFM2.5-2.6B on CUDA (Workbook 2 Table 38, exit criterion 1).
# Same specification as the Qwen3 references (ref_qwen3_*.yaml): BFCL multi-turn 3 x 100 tasks (fixed-seed
# sample), the 201 tau2 write tasks, 4 sampled trials (T 0.7, top_p 0.8, top_k 20; seeds 1-4) + 1 greedy pass,
# ctx 40,960 / 4,096-token cap, one simulated user per job. The prompt handler is testbed/prompt_formats.py
# (the model's own chat template; bfcl-eval has no handler for it). The sampling settings are the Qwen3
# card's, kept identical across models so the references compare.
#   bash scripts/tau2_submit.sh ref_lfm2p5_2p6b
#   python -m testbed.inclusion --run-dir $TESTBED_OUT/ref_lfm2p5_2p6b/<hash> --out results/m2/inclusion_lfm2.5-2.6b.json
experiment:
  name: ref_lfm2p5_2p6b
  model: lfm2.5-2.6b
  benchmark: bfcl_multi_turn_base
  task_sample: true
  n_tasks: 100
  thinking: false
  max_steps_per_turn: 20
  baselines:
    - {variant: bf16, backend: cuda}
    - {variant: bf16, backend: cuda, decoding: {temperature: 0.0, top_k: 1}, seeds: [0]}   # greedy pass
  baseline_seeds: [1, 2, 3, 4]
  repairs: []
  repair_seeds: [1]
  decoding: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, n_predict: 4096, cache_prompt: false}
  server: {ctx: 40960}
  tau2_settings: &tau2               # tau2-bench-verified, as the skeleton (official evaluator, unmodified)
    repo: amazon-agi/tau2-bench-verified
    commit: 864350a8971a8f8ee9e7b8472e2edc380a806b0c
    split: base
    max_steps: 200
    max_errors: 10
  simuser_settings: &simuser         # C4: served by one A100/H100 job per experiment (decision 4)
    model: gpt-oss-20b
    file: gpt-oss-20b-MXFP4.gguf
    hf_repo: ggml-org/gpt-oss-20b-GGUF
    hf_revision: ef9b12f2ff56c69cf32153a02784e7a3c88bf524
    sha256: 27cd6c432c7672cb812a92f611cf3ba7bbc35928262bb1e1253ff4ee6ae35901
    ctx: 32768
    temperature: 0.0
    chat_template_kwargs: {reasoning_effort: low}
  extra_benchmarks:
    - {name: bfcl_multi_turn_miss_func}
    - {name: bfcl_multi_turn_miss_param}
    - name: tau2_verified_airline               # all 26 write tasks (decision 6)
      require_write: true
      write_tools: [book_reservation, cancel_reservation, send_certificate, update_reservation_baggages, update_reservation_flights, update_reservation_passengers]
      tau2: *tau2
      simuser: *simuser
    - name: tau2_verified_retail               # all 104 write tasks (decision 6)
      require_write: true
      write_tools: [cancel_pending_order, exchange_delivered_order_items, modify_pending_order_address, modify_pending_order_items, modify_pending_order_payment, modify_user_address, return_delivered_order_items]
      tau2: *tau2
      simuser: *simuser
    - name: tau2_verified_telecom               # all 71 write tasks (decision 6)
      require_write: true
      write_tools: [disable_roaming, enable_roaming, refuel_data, resume_line, send_payment_request, suspend_line]
      tau2: *tau2
      simuser: *simuser
slurm:                               # one array task per configuration: up to 416 tau2 or 400 BFCL episodes
  time: "1-00:00:00"
  max_requeue: 3
models:
  lfm2.5-2.6b:
    hf_repo: LiquidAI/LFM2.5-2.6B
    files: {bf16: LFM2.5-2.6B-BF16.gguf}
