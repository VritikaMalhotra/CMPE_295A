# @package _global_
# R2c smoke test (development tasks, not the holdout): qwen3-0.6b, Q4_0 + Q8_0 resident, tool-call steps routed to
# Q8_0 by the first generated token. 5 BFCL multi_turn_base tasks of the development sample, seed 1, CUDA.
#   python -m testbed.run +experiment=r2c_smoke_qwen3_0p6b local=true
experiment:
  name: r2c_smoke_qwen3_0p6b
  model: qwen3-0.6b
  benchmark: bfcl_multi_turn_base
  task_sample: true
  n_tasks: 5
  thinking: false
  max_steps_per_turn: 20
  baselines: []
  baseline_seeds: [1]
  repairs:
    - {repair: r2, variant: r2c_tool, backend: cuda, constraint: none, server: {route: {policy: tool_call, high: q8_0}}}
  repair_seeds: [1]
  decoding: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, n_predict: 4096, cache_prompt: false}
  server: {ctx: 40960}
  extra_benchmarks: []
slurm:
  time: "01:00:00"
  max_requeue: 1
models:
  qwen3-0.6b:
    hf_repo: Qwen/Qwen3-0.6B
    files: {r2c_tool: Qwen3-0.6B-Q4_0-pure.gguf, q8_0: Qwen3-0.6B-Q8_0.gguf}
