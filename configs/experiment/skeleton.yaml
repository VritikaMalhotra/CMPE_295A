# @package _global_
# M1 walking skeleton (Workbook Ch. 8, Table 36), Colab version. 23 tasks: 20 BFCL multi-turn base + 3
# tau2-bench-verified airline (tau2 kept in M1, decided 2026-10-25); cluster criteria move to M2.
#   BFCL: 4 baseline configs x 20 tasks x 2 seeds = 160, 3 repair configs x 20 x 1 = 60   (220, done Oct 25)
#   tau2: 4 baseline configs x  3 tasks x 2 seeds =  24, 3 repair configs x  3 x 1 =  9   (33)
# The BFCL specs are unchanged by adding tau2 (same run_ids), so their finished episodes carry over.
experiment:
  name: skeleton
  model: qwen3-0.6b
  benchmark: bfcl_multi_turn_base
  n_tasks: 20                       # first 20 ids of BFCL_v4_multi_turn_base, file order
  thinking: false
  max_steps_per_turn: 20

  baselines:
    - {variant: bf16,   backend: cuda}
    - {variant: q4_k_m, backend: cuda}
    - {variant: q4_0,   backend: cuda}
    - {variant: q4_0,   backend: cpu}
  baseline_seeds: [1, 2]

  # one minimal run of each repair family, all compared against q4_0 on CUDA
  repairs:
    - {repair: r1, variant: q4_0,        backend: cuda, constraint: free}   # GBNF with free-text branch
    - {repair: r2, variant: q8_0,        backend: cuda, constraint: none}   # uniform added bits
    - {repair: r3, variant: r3_qad_q4_0, backend: cuda, constraint: none}   # S7 toy QAD -> S8 export
  repair_seeds: [1]

  # Qwen3 model card, non-thinking: T 0.7, top_p 0.8, top_k 20, min_p 0 (the pilot's sampled lane).
  # Greedy would make the two seeds identical on llama.cpp.
  decoding:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    n_predict: 4096                 # cap; per request min(4096, ctx - prompt - 2), as bfcl's local handler
    cache_prompt: false

  server:
    ctx: 40960                      # Qwen3-0.6B max_position_embeddings, what bfcl budgets against

  # Further benchmarks: same model, configs, seeds and decoding; their own task ids and harness settings.
  # Everything that can change a tau2 output is in the spec (server.tau2, server.simuser), so it is hashed.
  extra_benchmarks:
    - name: tau2_verified_airline
      task_ids: ["0", "1", "2"]       # first three ids of the airline base split (numeric order)
      tau2:
        repo: amazon-agi/tau2-bench-verified
        commit: 864350a8971a8f8ee9e7b8472e2edc380a806b0c
        split: base
        max_steps: 200                # tau2 CLI defaults (orchestrator messages, tool errors)
        max_errors: 10
      simuser:                        # C4: simulated user and NL judge, self-hosted, greedy, cached
        model: gpt-oss-20b            # one of the S5 candidates; S5's choice replaces it in M2
        file: gpt-oss-20b-MXFP4.gguf
        hf_repo: ggml-org/gpt-oss-20b-GGUF
        hf_revision: ef9b12f2ff56c69cf32153a02784e7a3c88bf524
        sha256: 27cd6c432c7672cb812a92f611cf3ba7bbc35928262bb1e1253ff4ee6ae35901
        ctx: 32768
        temperature: 0.0
        chat_template_kwargs: {reasoning_effort: low}

models:
  qwen3-0.6b:
    hf_repo: Qwen/Qwen3-0.6B
    files:
      bf16: Qwen3-0.6B-BF16.gguf
      q4_k_m: Qwen3-0.6B-Q4_K_M.gguf
      q4_0: Qwen3-0.6B-Q4_0-pure.gguf
      q8_0: Qwen3-0.6B-Q8_0.gguf
      r3_qad_q4_0: Qwen3-0.6B-S7QAD-Q4_0-pure.gguf
    # SHA-256 of the Oct 8 pilot files (progress/quant_files.csv); checked before any run
    sha256:
      bf16: 9a07b327d6114b23cd022cd0b188629aa0d02f88c863becaa34af5fc374281a2
      q4_k_m: 40b0bbe7c787ac694f2f635ead2bcfebf19a7d6f1130d63155155fc0b83bdc6c
      q4_0: 90d6e31f1034a14e7d382c0a5de3e0c2bafa1e1b6b2d1869ebea5b8e2c4482ab
