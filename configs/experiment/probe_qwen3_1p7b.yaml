# @package _global_
# M2 model probe (Friday's decision): can Qwen3-1.7B complete BFCL multi-turn tasks that 0.6B fails?
# Same 20 tasks, decoding and server settings as the skeleton; BF16 and pure Q4_0 on CUDA; seed 1.
#   scripts/make_probe_models.sh Qwen/Qwen3-1.7B /content/models <cache>
#   python -m testbed.run +experiment=probe_qwen3_1p7b local=true
experiment:
  name: probe_qwen3_1p7b
  model: qwen3-1.7b
  benchmark: bfcl_multi_turn_base
  n_tasks: 20
  thinking: false
  max_steps_per_turn: 20
  baselines:
    - {variant: bf16, backend: cuda}
    - {variant: q4_0, backend: cuda}
  baseline_seeds: [1]
  repairs: []
  repair_seeds: [1]
  decoding:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.0
    n_predict: 4096
    cache_prompt: false
  server:
    ctx: 40960

models:
  qwen3-1.7b:
    hf_repo: Qwen/Qwen3-1.7B
    files:
      bf16: Qwen3-1.7B-BF16.gguf
      q4_0: Qwen3-1.7B-Q4_0-pure.gguf
