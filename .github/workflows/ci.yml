# CI (Workbook Ch. 7, design spec 6.2 item 17): unit tests on every push and pull request; a CPU-backend
# integration job that builds llama.cpp at the pinned commit, builds Qwen3-0.6B Q4_0/Q8_0 with the pinned
# converter, runs one smoke episode end to end and runs the R1 property test against llama.cpp's grammar
# engine. CUDA tests and all measurements run on the cluster, not here.
name: ci

on:
  push:
    branches: [main, m2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_COMMIT: d81235049384534c167caea52b85a694f6103d14   # = scripts/setup_env.sh LLAMA_COMMIT
  PYTHON_VERSION: "3.12"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (as scripts/setup_env.sh does)
        run: |
          uv venv -p "$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          uv pip install --python .venv/bin/python --no-deps "bfcl-eval==2026.3.23"
      - name: Tests with coverage
        run: .venv/bin/python -m pytest -q --cov=testbed --cov-report=term-missing:skip-covered

  cpu-integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 75
    env:
      TESTBED_MODELS: ${{ github.workspace }}/models
      TESTBED_OUT: ${{ github.workspace }}/runs
      LLAMA_CPU_BIN: ${{ github.workspace }}/llama.cpp/build-cpu/bin/llama-server
      LLAMA_QUANTIZE: ${{ github.workspace }}/llama.cpp/build-cpu/bin/llama-quantize
      LLAMA_CPU_FLAGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Restore llama.cpp build
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpu-${{ env.LLAMA_COMMIT }}-v1
      - name: Python env and llama.cpp (CPU build at the pinned commit)
        run: bash scripts/setup_env.sh --llama
      - name: GBNF validator (for the R1 property test)
        run: |
          if [ ! -x llama.cpp/build-tests/bin/test-gbnf-validator ]; then
            cmake -S llama.cpp -B llama.cpp/build-tests -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON \
                  -DCMAKE_BUILD_TYPE=Release $LLAMA_CPU_FLAGS
            cmake --build llama.cpp/build-tests --target test-gbnf-validator -j "$(nproc)"
          fi
      - name: Restore model files
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-0.6b-q4_0-pure-q8_0-${{ env.LLAMA_COMMIT }}-v1
      - name: Build Qwen3-0.6B GGUFs (pinned converter; only when not cached)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          uv pip install --python .venv/bin/python "transformers>=4.51" "safetensors>=0.4" "sentencepiece>=0.2" \
                         "huggingface_hub[cli]" ./llama.cpp/gguf-py
          MODEL_SRC_DIR=$RUNNER_TEMP/hf LLAMA_DIR=$PWD/llama.cpp VARIANTS="Q4_0-pure Q8_0" \
            bash scripts/make_probe_models.sh Qwen/Qwen3-0.6B "$TESTBED_MODELS"
          rm -f "$TESTBED_MODELS/Qwen3-0.6B-BF16.gguf"     # only the two smoke variants are cached
      - name: R1 property test against llama.cpp's grammar engine
        run: |
          LLAMA_GBNF_VALIDATOR=$PWD/llama.cpp/build-tests/bin/test-gbnf-validator \
            .venv/bin/python -m pytest -q tests/test_r1_property.py
      - name: One smoke episode on the CPU backend
        run: |
          .venv/bin/python -m testbed.run +experiment=smoke local=true allow_sha_mismatch=true limit=1 cpu_threads=4
          n=$(find "$TESTBED_OUT/smoke" -path '*/episodes/*.json' | wc -l)
          test "$n" -ge 1 || { echo "no finished episode"; exit 1; }
          f=$(find "$TESTBED_OUT/smoke" -path '*/steps/*.jsonl' | head -1)
          .venv/bin/python - "$f" <<'PY'
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1])]
          assert rows and all(r["prompt_sha256"] and r["prompt_tokens_sha256"] and r["failure_class"] for r in rows), rows[:1]
          print(f"{len(rows)} steps logged with prompt hashes and C6 labels")
          PY
      - name: Keep the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: runs
          if-no-files-found: ignore
          retention-days: 7
